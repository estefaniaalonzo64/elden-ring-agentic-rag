<style>
  :root {
    color-scheme: light;
    --bg: #12100e;
    --panel: #1c1815;
    --text: #ece4d8;
    --muted: #9a8f80;
    --accent: #c9a24a;
    --error: #d16a6a;
    --border: #33291f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
  }

  .screen {
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 100%;
  }

  h1 {
    font-size: 22px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  input, textarea {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 4px;
    font: inherit;
    font-size: 15px;
  }

  textarea { resize: vertical; }

  button {
    background: var(--accent);
    color: #1c1815;
    border: none;
    padding: 10px 14px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    font: inherit;
  }

  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .switch { color: var(--muted); font-size: 14px; }
  .switch a { color: var(--accent); }

  .error {
    color: var(--error);
    font-size: 14px;
    min-height: 1em;
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px 0;
  }

  .message {
    padding: 10px 12px;
    border-radius: 6px;
    white-space: pre-wrap;
    line-height: 1.4;
  }

  .message.user {
    align-self: flex-end;
    background: var(--accent);
    color: #1c1815;
    max-width: 85%;
  }

  .message.assistant {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    max-width: 90%;
  }

  .sources {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    max-width: 90%;
  }

  #chat-form {
    flex-direction: row;
    gap: 8px;
  }

  #chat-form textarea { flex: 1; }
</style>
