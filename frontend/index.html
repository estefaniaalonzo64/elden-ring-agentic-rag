<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elden Ring Guide</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>

  <section id="screen-login" class="screen">
    <h1>Elden Ring Guide</h1>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Usuario" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <p class="error" id="login-error"></p>
  </section>

  <section id="screen-chat" class="screen" hidden>
    <header class="chat-header">
      <h1>Elden Ring Guide</h1>
      <button type="button" id="logout-button" class="secondary">Cerrar sesión</button>
    </header>
    <div class="chat-layout">
      <aside id="conversations-panel">
        <div class="conversations-header">
          <h2>Mis conversaciones</h2>
          <button type="button" id="new-conversation-button" class="secondary">Nueva</button>
        </div>
        <ul id="conversations-list"></ul>
      </aside>
      <div class="chat-main">
        <div id="messages"></div>
        <p id="thinking-indicator" hidden>Pensando...</p>
        <form id="chat-form">
          <textarea id="chat-input" placeholder="Pregunta algo sobre Elden Ring..." rows="2" required></textarea>
          <button type="submit" id="chat-submit">Enviar</button>
        </form>
      </div>
    </div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
